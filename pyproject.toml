[project]
name = "base32-crockford-decoder"
version = "0.1.1"
description = "Encodes and decodes integers and byte sequences using Douglas Crockford's Base32 variant designed for human transcription."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
